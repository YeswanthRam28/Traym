<!DOCTYPE html>
<html>
<head>
    <title>Traym Notion Login Redirect</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #f2f2f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #d6ff00;
        }
        p {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <h1>Logging you into Traym...</h1>
    <p>Please wait while we redirect you back to the app.</p>
    <script>
        // Redirect back to the mobile app using the custom scheme, preserving the query parameters (like ?code=...)
        setTimeout(() => {
            window.location.href = "traym://notion-auth" + window.location.search;
        }, 100);
    </script>
</body>
</html>
